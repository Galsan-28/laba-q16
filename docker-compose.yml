services:
  minio:
    image: pgsty/silo:latest
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: pgsty/mc:latest
    depends_on: [minio]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set m http://minio:9000 minioadmin minioadmin; do sleep 2; done
        mc mb --ignore-existing m/bronze m/silver m/gold
        mc ls m

  postgres:
    image: postgres:17
    container_name: lakehouse-pg
    environment:
      POSTGRES_PASSWORD: postgres
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:latest-main
    restart: "no"
    command: ["migrate"]
    environment: &lk-env
      LAKEKEEPER__PG_ENCRYPTION_KEY: "This-is-NOT-Secure!"
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://postgres:postgres@postgres:5432/postgres
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres: {condition: service_healthy}

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest-main
    container_name: lakekeeper
    command: ["serve"]
    environment: *lk-env
    ports: ["8181:8181"]
    depends_on:
      lakekeeper-migrate: {condition: service_completed_successfully}

  lakekeeper-init:
    image: curlimages/curl:latest
    restart: "no"
    depends_on: [lakekeeper, minio-init]
    volumes: ["./init/init-lakekeeper.sh:/init.sh:ro"]
    entrypoint: ["/bin/sh", "/init.sh"]

  trino:
    image: trinodb/trino:476
    container_name: trino
    ports: ["8080:8080"]
    volumes:
      - ./catalog:/etc/trino/catalog
      - ./sql:/sql:ro
    depends_on: [lakekeeper-init]

  superset:
    profiles: ["bi"]
    build: ./superset
    container_name: superset
    environment:
      SUPERSET_SECRET_KEY: "change-me-lab-only-0123456789abcdef0123456789"
    ports: ["8088:8088"]
    depends_on: [trino]
    command:
      - /bin/sh
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin --username admin --firstname a --lastname a --email a@a.a --password admin &&
        superset init &&
        /usr/bin/run-server.sh

volumes:
  minio-data:
  pg-data:
